<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">V</span>
      <span class="brand-name">Veimen</span>
    </div>

    <h1 class="auth-title">Inicia sesión</h1>
    <p class="auth-subtitle">Accede con tu usuario o correo.</p>

    @if (error(); as error) {
      <div class="auth-message auth-error" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="identifier">Usuario o correo</label>
        <input
          id="identifier"
          type="text"
          formControlName="identifier"
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      <button class="btn-primary" type="submit" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner" aria-hidden="true"></span>
          Entrando…
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</div>
